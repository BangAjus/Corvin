<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corvin - Server Node Simulation</title>
    <style>
        :root {
            --navy-primary: #0A2540;
            --navy-light: #1E3A8A;
            --white: #FFFFFF;
            --gray-bg: #F8FAFC;
            --error-red: #EF4444;
            --success-green: #10B981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--gray-bg);
            color: var(--navy-primary);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--navy-primary);
            color: var(--white);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        header p {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 5px;
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .control-panel {
            background: var(--white);
            padding: 20px;
            border-radius: 8px;
            border: 2px solid var(--navy-primary);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-panel h2 {
            font-size: 1.2rem;
            border-bottom: 2px solid var(--navy-primary);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .scenario-btn {
            background-color: var(--white);
            color: var(--navy-primary);
            border: 2px solid var(--navy-primary);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-align: left;
            transition: all 0.2s ease;
        }

        .scenario-btn:hover {
            background-color: var(--navy-primary);
            color: var(--white);
        }

        .scenario-btn.active {
            background-color: var(--navy-primary);
            color: var(--white);
            box-shadow: 0 0 8px rgba(10, 37, 64, 0.5);
        }

        .status-box {
            margin-top: auto;
            background: var(--navy-primary);
            color: var(--white);
            padding: 15px;
            border-radius: 6px;
            font-size: 0.85rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .status-box h3 {
            margin-bottom: 5px;
            color: #60A5FA;
        }

        .simulation-container {
            background: var(--white);
            border-radius: 8px;
            border: 2px solid var(--navy-primary);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .graph-area {
            flex: 1;
            position: relative;
            background-image: radial-gradient(#CBD5E1 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 500px;
        }

        /* Network Connections via SVG */
        .network-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .node {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: var(--white);
            border: 4px solid var(--navy-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s, border-color 0.3s;
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .node:hover {
            transform: scale(1.05);
        }

        .node.error {
            border-color: var(--error-red);
            background-color: #FEF2F2;
        }

        .node.hidden-error {
            /* Looks completely normal until human arrives */
            border-color: var(--navy-primary);
            background-color: var(--white);
        }

        .node-label {
            margin-top: 2px;
            font-size: 0.7rem;
            color: #64748B;
        }

        /* Actors / Finders */
        .finder {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 1.5s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 20;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        #robot-finder {
            background-color: var(--navy-light);
            border: 2px solid var(--white);
            color: var(--white);
            /* Base offset so they don't overlap perfectly */
            margin-left: -20px;
            margin-top: -20px;
        }

        #human-finder {
            background-color: #F59E0B;
            border: 2px solid var(--white);
            color: var(--white);
            margin-left: 20px;
            margin-top: -20px;
            display: none;
        }

        .legend {
            display: flex;
            gap: 20px;
            padding: 15px;
            background: #F1F5F9;
            border-top: 2px solid var(--navy-primary);
            font-size: 0.85rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Corvin</h1>
        <p>Delta Competition Framework • Mobile Mini-Crane Node Tracking System</p>
    </header>

    <main>
        <section class="control-panel">
            <h2>Scenarios</h2>
            <button class="scenario-btn active" onclick="triggerScenario('A', this)">Scenario A: Idling</button>
            <button class="scenario-btn" onclick="triggerScenario('B', this)">Scenario B: Robot Auto-Fix</button>
            <button class="scenario-btn" onclick="triggerScenario('C', this)">Scenario C: Human Assist</button>

            <div class="status-box">
                <h3>System Logs</h3>
                <div id="log-output">System initialized. Awaiting scenario selection...</div>
            </div>
        </section>

        <section class="simulation-container">
            <div class="graph-area" id="graph-area">
                <svg class="network-lines">
                    <line x1="150" y1="250" x2="400" y2="100" stroke="#0A2540" stroke-width="2" />
                    <line x1="150" y1="250" x2="400" y2="400" stroke="#0A2540" stroke-width="2" />
                    <line x1="400" y1="100" x2="650" y2="250" stroke="#0A2540" stroke-width="2" />
                    <line x1="400" y1="400" x2="650" y2="250" stroke="#0A2540" stroke-width="2" />
                    <line x1="400" y1="100" x2="400" y2="400" stroke="#0A2540" stroke-dasharray="5,5"
                        stroke-width="2" />
                </svg>

                <div id="node-main" class="node" style="left: 105px; top: 205px;" onclick="inspectNode('Main Server')">
                    <span>Main</span>
                    <span class="node-label">Root Node</span>
                </div>
                <div id="node-cpu" class="node" style="left: 355px; top: 55px;" onclick="inspectNode('CPU Cluster')">
                    <span>CPU</span>
                    <span class="node-label">Compute</span>
                </div>
                <div id="node-gpu" class="node" style="left: 355px; top: 355px;" onclick="inspectNode('GPU Array')">
                    <span>GPU</span>
                    <span class="node-label">Processing</span>
                </div>
                <div id="node-storage" class="node" style="left: 605px; top: 205px;" onclick="inspectNode('Storage')">
                    <span>Storage</span>
                    <span class="node-label">Database</span>
                </div>

                <div id="robot-finder" class="finder" title="Mini-Crane wheeled Robot">🏗️</div>
                <div id="human-finder" class="finder" title="Human Operator Assistance">👨‍🔧</div>
            </div>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--navy-primary);"></div> Connected Node
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--error-red);"></div> Critical Hardware Error
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--navy-light);"></div> 🏗️ Crane Robot
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #F59E0B;"></div> 👨‍🔧 Human Finder
                </div>
            </div>
        </section>
    </main>

    <script>
        // Core Node Configurations
        const nodes = {
            main: { id: 'node-main', x: 150, y: 250, name: 'Main Server' },
            cpu: { id: 'node-cpu', x: 400, y: 100, name: 'CPU Cluster' },
            gpu: { id: 'node-gpu', x: 400, y: 400, name: 'GPU Array' },
            storage: { id: 'node-storage', x: 650, y: 250, name: 'Storage Disk' }
        };

        const robot = document.getElementById('robot-finder');
        const human = document.getElementById('human-finder');
        const logOutput = document.getElementById('log-output');

        // Initialize positions
        function moveActor(actor, x, y) {
            actor.style.left = `${x}px`;
            actor.style.top = `${y}px`;
        }

        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            logOutput.innerHTML = `[${timestamp}] ${message}<br>` + logOutput.innerHTML;
        }

        function clearNodeStates() {
            document.querySelectorAll('.node').forEach(n => {
                n.classList.remove('error', 'hidden-error');
            });
            human.style.display = 'none';
        }

        function resetToHome() {
            moveActor(robot, nodes.main.x, nodes.main.y);
            moveActor(human, nodes.main.x, nodes.main.y);
        }

        function inspectNode(name) {
            log(`User manual click: Inspecting performance metrics for ${name}.`);
        }

        // Run scenarios
        function triggerScenario(type, btnElement) {
            // Update UI buttons
            document.querySelectorAll('.scenario-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            clearNodeStates();
            resetToHome();

            if (type === 'A') {
                log("Scenario A triggered: System fully healthy. Robot crane is idling at Main Node.");
            }

            else if (type === 'B') {
                log("Scenario B triggered: Error registered in server components.");

                // Set errors on CPU and GPU
                const cpuNode = document.getElementById('node-cpu');
                const gpuNode = document.getElementById('node-gpu');
                cpuNode.classList.add('error');
                gpuNode.classList.add('error');

                log("⚠️ ALERT: CPU Cluster overheating. GPU Array voltage instability detected.");

                // Phase 1: Move to CPU
                setTimeout(() => {
                    log("🏗️ Crane Robot dispatched to CPU Cluster...");
                    moveActor(robot, nodes.cpu.x, nodes.cpu.y);
                }, 1000);

                // Phase 2: Fix CPU, Move to GPU
                setTimeout(() => {
                    log("🔧 Robot arrived at CPU. Activating mini-crane hoist mechanism. CPU component replaced.");
                    cpuNode.classList.remove('error');

                    log("🏗️ Crane Robot rerouting to GPU Array...");
                    moveActor(robot, nodes.gpu.x, nodes.gpu.y);
                }, 3000);

                // Phase 3: Fix GPU, return
                setTimeout(() => {
                    log("🔧 Robot arrived at GPU. Recalibrating physical power rails. GPU operational.");
                    gpuNode.classList.remove('error');
                    log("✅ All hardware components secured. Returning to Base.");
                    moveActor(robot, nodes.main.x, nodes.main.y);
                }, 5500);
            }

            else if (type === 'C') {
                log("Scenario C triggered: Anomaly present. Robot sensors blind to hardware failure location.");

                const storageNode = document.getElementById('node-storage');
                // Target node has a hidden error (looks normal)
                storageNode.classList.add('hidden-error');

                human.style.display = 'flex';
                log("👤 Human operator dispatched alongside Robot to identify physical server structural damage.");

                setTimeout(() => {
                    log("🏃‍♂️ Dual team moving through the server architecture topology...");
                    moveActor(robot, nodes.storage.x, nodes.storage.y);
                    moveActor(human, nodes.storage.x, nodes.storage.y);
                }, 1200);

                setTimeout(() => {
                    log("🔍 Human arrived at Storage Node and flagged structural visual failure.");
                    // Reveal error once human arrives
                    storageNode.classList.remove('hidden-error');
                    storageNode.classList.add('error');
                    log("⚠️ Hidden Anomaly Revealed: Storage Controller Board physical interface broken.");
                }, 3000);

                setTimeout(() => {
                    log("🔧 Mini-crane robot deployed using structural human coordinates to mount storage rack.");
                    storageNode.classList.remove('error');
                    log("✅ Storage array restored. Dynamic testing successful.");
                }, 5000);
            }
        }

        // Inital setup execution
        window.onload = () => {
            resetToHome();
        };
    </script>
</body>

</html>
